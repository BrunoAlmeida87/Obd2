# Publica o app (arquivos estáticos da raiz) no GitHub Pages.
# O Pages precisa estar configurado com "Source: GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, ccr-402aef19-68chts]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JSON de dados
        run: |
          python3 -c "import json; json.load(open('data/dtc-db.json')); json.load(open('data/pids.json')); json.load(open('data/modo06.json')); json.load(open('data/etapas-guiadas.json')); print('JSON ok')"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes do núcleo (simulador, ELM327, ISO-TP, OBD, módulos Kia)
        run: node tools/test/nucleo.test.mjs

      - name: Montar pasta de publicação
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
