<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Diagnóstico OBD2 para Kia Cerato 2014 com ELM327 Bluetooth. Lê e apaga códigos de erro, mostra dados ao vivo e explica os problemas em português.">
  <title>Cerato OBD2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Barra superior: título da tela e indicador de conexão -->
  <header class="topbar">
    <button class="topbar-back hidden" id="btnBack" aria-label="Voltar"></button>
    <h1 id="screenTitle">Início</h1>
    <div class="conn-pill" id="connPill" data-state="off">
      <span class="dot"></span><span class="label">Desconectado</span>
    </div>
  </header>

  <!-- Faixa de aviso (API ausente, modo demo, etc.) -->
  <div id="banner" class="banner hidden" role="status"></div>

  <!-- Conteúdo da aba atual é renderizado aqui -->
  <main id="view" class="view" tabindex="-1"></main>

  <!-- Navegação inferior com as 5 abas -->
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
    <button data-tab="home" class="active"><span class="ico" data-icon="home"></span><span>Início</span></button>
    <button data-tab="dtc"><span class="ico" data-icon="alert"></span><span>Erros</span></button>
    <button data-tab="live"><span class="ico" data-icon="gauge"></span><span>Ao vivo</span></button>
    <button data-tab="history"><span class="ico" data-icon="history"></span><span>Histórico</span></button>
    <button data-tab="more"><span class="ico" data-icon="menu"></span><span>Mais</span></button>
  </nav>

  <!-- Área de diálogos e notificações -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <noscript>Este aplicativo precisa de JavaScript ativado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
